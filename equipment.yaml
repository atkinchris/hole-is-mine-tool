# Equipment catalogue for Hole is Mine.
#
# slots      - the four equipment slots a Mini'Oh has, one item each.
# equipment  - every known item, grouped by the slot it occupies. Names are
#              unique across all slots and are how items are referred to.
# combos     - named bonuses granted when one Mini'Oh wears all the listed items
#              at the same time. A combo names at most one item per slot.

slots:
  - head
  - back
  - tool
  - mask

equipment:
  mask:
    - Wolf Skin
    - Wrestling Mask
    - Kloning Gasmask
    - Dragoon Face
    - Evil Mask

  back:
    - Friendship Wool
    - Bouncy Float
    - Lost Anchor
    - Infinite Dynamite
    - Holy Wings

  tool:
    - Golden Pickaxe
    - Mending Crutch
    - Heavy Tool
    - Holy Harp
    - Battered Wand

  head:
    - Holy Hole
    - Bravery Helmet
    - Plasticky Hat
    - Sonic Helmet
    - Merchant Hat

combos:
  Whywolf:
    requires:
      mask: Wolf Skin
      head: Merchant Hat
      tool: Mending Crutch

  Movie Star:
    requires:
      mask: Wrestling Mask
      head: Merchant Hat
      tool: Heavy Tool

  Blood and Sand:
    requires:
      mask: Wrestling Mask
      back: Bouncy Float
      head: Plasticky Hat

  Wee Ooo Wee Ooo!:
    requires:
      mask: Kloning Gasmask
      tool: Mending Crutch
      head: Bravery Helmet

  Festive Dragon:
    requires:
      mask: Dragoon Face
      head: Holy Hole
      back: Infinite Dynamite

  Whole Demon:
    requires:
      mask: Evil Mask
      back: Holy Wings
      tool: Holy Harp
      head: Holy Hole
